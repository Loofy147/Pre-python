name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  observe-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Capture warning on native platform
        run: python scripts/capture_warning_evidence.py --release 0.1.0 --matrix fixtures/audit-matrix.json --output warning-evidence/${{ matrix.os }}.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: warning-evidence-${{ matrix.os }}
          path: warning-evidence/${{ matrix.os }}.json
          if-no-files-found: error

  build:
    needs: observe-platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install package and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests and type checks
        run: |
          python -W error::DeprecationWarning -m pytest
          python -m mypy
      - name: Build source distribution
        run: python -m build --sdist
      - name: Build wheel from source distribution
        run: |
          python -m build --wheel dist/chipcup-0.1.0.tar.gz --outdir dist/wheel-from-sdist
          mv dist/wheel-from-sdist/*.whl dist/
          rmdir dist/wheel-from-sdist
      - name: Validate distributions
        run: python -m twine check dist/*
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: warning-evidence-*
          path: warning-evidence
          merge-multiple: true
      - name: Execute seven-boundary release audit
        run: |
          python -m chipcup.cli \
            --sdist dist/chipcup-0.1.0.tar.gz \
            --wheel dist/chipcup-0.1.0-py3-none-any.whl \
            --matrix fixtures/audit-matrix.json \
            --warning-evidence warning-evidence/ \
            --project-root .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: chipcup-distributions
          path: dist/*
          if-no-files-found: error

  publish-github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: chipcup-distributions
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
