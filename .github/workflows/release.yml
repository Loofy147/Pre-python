name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install package and release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests and type checks
        run: |
          python -W error::DeprecationWarning -m pytest
          python -m mypy
      - name: Build source distribution
        run: python -m build --sdist
      - name: Build wheel from source distribution
        run: |
          python -m build --wheel dist/chipcup-0.1.0.tar.gz --outdir dist/wheel-from-sdist
          mv dist/wheel-from-sdist/*.whl dist/
          rmdir dist/wheel-from-sdist
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Execute seven-boundary release audit
        run: |
          python -m chipcup.cli \
            --sdist dist/chipcup-0.1.0.tar.gz \
            --wheel dist/chipcup-0.1.0-py3-none-any.whl \
            --matrix fixtures/audit-matrix.json \
            --project-root .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: chipcup-distributions
          path: dist/*
          if-no-files-found: error

  publish-github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: chipcup-distributions
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
