name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests with deprecations visible
        run: python -W error::DeprecationWarning -m pytest
      - name: Static typing and coded escape checks
        if: matrix.python-version == '3.13'
        run: python -m mypy

  platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install test environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run import and marker matrix tests
        run: python -W error::DeprecationWarning -m pytest
      - name: Capture warning on the native platform
        run: python scripts/capture_warning_evidence.py --release 0.1.0 --matrix fixtures/audit-matrix.json --output warning-evidence/${{ matrix.os }}.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: warning-evidence-${{ matrix.os }}
          path: warning-evidence/${{ matrix.os }}.json
          if-no-files-found: error

  build-audit:
    runs-on: ubuntu-latest
    needs: [test, platform]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - name: Install audit tools and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Build source distribution
        run: python -m build --sdist
      - name: Build wheel from the source distribution
        run: |
          python -m build --wheel dist/chipcup-0.1.0.tar.gz --outdir dist/wheel-from-sdist
          mv dist/wheel-from-sdist/*.whl dist/
          rmdir dist/wheel-from-sdist
      - name: Validate built distributions
        run: python -m twine check dist/*
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: warning-evidence-*
          path: warning-evidence
          merge-multiple: true
      - name: Run seven-boundary release audit
        run: |
          python -m chipcup.cli \
            --sdist dist/chipcup-0.1.0.tar.gz \
            --wheel dist/chipcup-0.1.0-py3-none-any.whl \
            --matrix fixtures/audit-matrix.json \
            --warning-evidence warning-evidence/ \
            --project-root .
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: chipcup-distributions
          path: dist/*
          if-no-files-found: error
