[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chipcup"
version = "0.1.0"
description = "A typed Python packaging auditor with seven executable formal-system boundaries."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSES/Fixture-Dual.txt"]
authors = [{ name = "chipcup contributors" }]
keywords = ["python-packaging", "pep-440", "pep-508", "spdx", "typing", "build"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "packaging>=24.2",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["build>=1.2.2", "mypy>=1.13", "pytest>=8.3", "twine>=6.1"]

[project.scripts]
"chipcup.audit" = "chipcup.cli:main"

[project.entry-points."chipcup.plugins"]
demo = "chipcup.plugins.demo:DemoPlugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["chipcup*"]
namespaces = true

[tool.setuptools.package-data]
chipcup = ["py.typed"]

[tool.setuptools.data-files]
"chipcup/fixtures" = ["fixtures/chip.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
disallow_any_explicit = true
enable_error_code = ["ignore-without-code"]
warn_unused_ignores = true
files = ["src/chipcup"]
